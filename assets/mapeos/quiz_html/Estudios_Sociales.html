            { topic: 'etnias', q: '¿Quién es la principal divinidad de los Bribris?', opts: ['Zeus', 'Sibö', 'Ra', 'Odin'], a: 'Sibö', cite: 'Dan culto a Sibö principal divinidad, creador de la Tierra y el hombre.', p: '23' },

            { topic: 'etnias', q: '¿Qué tipo de filiación conservan los Cabécares?', opts: ['Paterna', 'Materna de clanes', 'No tienen clanes', 'Solo por amistad'], a: 'Materna de clanes', cite: 'Conservan la filiación materna de clanes organizando socialmente el orden de las relaciones...', p: '27' },
            { topic: 'etnias', q: 'Además de agricultura, ¿qué otra actividad hacen los Cabécares?', opts: ['Volar aviones', 'Pesca y ganadería', 'Cine', 'Fútbol'], a: 'Pesca y ganadería', cite: '...a la pesca y la ganadería, adicionalmente elaboran productos artesanales...', p: '27' },

            { topic: 'etnias', q: 'Mencione una fuente natural para teñir hilos (Borucas).', opts: ['Tinte de pelo', 'Hojas de sangrilla o arcilla', 'Pintura de pared', 'Tinta de lapicero'], a: 'Hojas de sangrilla o arcilla', cite: '...tienen una larga tradición de teñir a mano hilos de colores que provienen de fuentes naturales tales como las hojas del árbol sangrilla, la corteza del árbol carbonero, arcilla, plantas de índigo y... la tinta de un molusco.', p: '30' },
            { topic: 'etnias', q: 'Mencione una fiesta tradicional Boruca.', opts: ['Navidad', 'Fiesta de los Diablitos', 'Carnavales', 'Tope'], a: 'Fiesta de los Diablitos', cite: 'Las actividades más importantes para los Borucas son la Fiesta de los Diablitos y la Fiesta de los Negritos.', p: '30' },
            { topic: 'etnias', q: '¿Qué representa la Fiesta de los Diablitos?', opts: ['Una fiesta de disfraces', 'La lucha contra la cultura colonizadora', 'El inicio del año', 'La cosecha de café'], a: 'La lucha contra la cultura colonizadora', cite: 'La Fiesta de los Diablitos representa la lucha hasta la muerte con la cultura colonizadora...', p: '30' }
        ];

        let shuffledQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctCount = 0;
        let totalToAnswer = rawQuestions.length;

        const progressBar = document.getElementById('progress-bar');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedback-text');
        const citationText = document.getElementById('citation-text');
        const pageNum = document.getElementById('page-num');
        const quizContainer = document.getElementById('quiz-container');
        const resultsContainer = document.getElementById('results-container');
        const scoreEl = document.getElementById('score');
        const finalMessage = document.getElementById('final-message');
        const topicContentEl = document.getElementById('topic-content');

        function showContent(tabName) {
            document.getElementById('estudio').style.display = 'none';
            document.getElementById('quiz').style.display = 'none';
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabName).style.display = 'block';
            document.querySelector(`.tab-button[onclick="showContent('${tabName}')"]`).classList.add('active');
            
            if (tabName === 'quiz' && shuffledQuestions.length === 0) {
                startQuiz();
            }
        }

        function showTopic(topicName) {
            topicContentEl.innerHTML = topicData[topicName];
            document.querySelectorAll('#estudio .tab-button').forEach(b => b.classList.remove('active'));
            document.querySelector(`#estudio .tab-button[onclick="showTopic('${topicName}')"]`).classList.add('active');
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            shuffledQuestions = shuffle([...rawQuestions]);
            currentQuestionIndex = 0;
            score = 0;
            correctCount = 0;
            totalToAnswer = rawQuestions.length;
            resultsContainer.style.display = 'none';
            quizContainer.style.display = 'block';
            updateProgressBar();
            displayQuestion();
        }

        function restartQuiz() {
            shuffledQuestions = [];
            startQuiz();
        }

        function displayQuestion() {
            feedbackEl.style.display = 'none';
            const currentQuestion = shuffledQuestions[currentQuestionIndex];
            questionEl.textContent = `${currentQuestionIndex + 1}. ${currentQuestion.q}`;
            optionsEl.innerHTML = '';
            
            const currentOpts = shuffle([...currentQuestion.opts]);
            currentOpts.forEach(option => {
                const button = document.createElement('div');
                button.textContent = option;
                button.classList.add('option');
                button.onclick = () => checkAnswer(option, button);
                optionsEl.appendChild(button);
            });
        }

        function checkAnswer(selected, button) {
            const currentQuestion = shuffledQuestions[currentQuestionIndex];
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.onclick = null);

            feedbackEl.style.display = 'block';
            citationText.textContent = currentQuestion.cite;
            pageNum.textContent = `Página ${currentQuestion.p}`;

            if (selected === currentQuestion.a) {
                score += 10;
                correctCount++;
                feedbackText.innerHTML = "✅ ¡Excelente! Respuesta correcta.";
                feedbackEl.style.borderColor = 'var(--correct-color)';
                feedbackEl.style.backgroundColor = '#e8f5e9';
                button.style.backgroundColor = 'var(--correct-color)';
                button.style.color = 'white';
                button.style.borderColor = 'var(--correct-color)';
            } else {
                feedbackText.innerHTML = `❌ Oops, la respuesta correcta era: <strong>${currentQuestion.a}</strong>.`;
                feedbackEl.style.borderColor = 'var(--wrong-color)';
                feedbackEl.style.backgroundColor = '#ffebee';
                button.style.backgroundColor = 'var(--wrong-color)';
                button.style.color = 'white';
                button.style.borderColor = 'var(--wrong-color)';
                
                allOptions.forEach(opt => {
                    if (opt.textContent === currentQuestion.a) {
                        opt.style.border = '3px solid var(--correct-color)';
                    }
                });

                // Reinforcement logic: find another question of same topic and push it
                const sameTopicQuestions = rawQuestions.filter(q => q.topic === currentQuestion.topic && q.q !== currentQuestion.q);
                if (sameTopicQuestions.length > 0) {
                    const extraQ = sameTopicQuestions[Math.floor(Math.random() * sameTopicQuestions.length)];
                    shuffledQuestions.push({...extraQ});
                    totalToAnswer++;
                }
            }
            updateProgressBar();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                displayQuestion();
            } else {
                showResults();
            }
        }

        function updateProgressBar() {
            const progress = (correctCount / totalToAnswer) * 100;
            progressBar.style.width = progress + '%';
            progressBar.textContent = Math.round(progress) + '%';
        }

        function showResults() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            const finalScore = (correctCount / totalToAnswer) * 100;
            scoreEl.textContent = `${Math.round(finalScore)}%`;
            
            if (finalScore >= 90) finalMessage.textContent = "¡Eres un experto en Historia de Costa Rica! 🌟";
            else if (finalScore >= 70) finalMessage.textContent = "¡Muy bien! Has aprendido mucho. 👍";
            else finalMessage.textContent = "Sigue practicando, ¡tú puedes lograrlo! 💪";
        }

        document.addEventListener('DOMContentLoaded', () => {
            showTopic('historia');
        });
    </script>
