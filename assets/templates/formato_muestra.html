            'biodiversidad': `
                <h3>¿Qué es la Biodiversidad?</h3>
                <p>Es la gran variedad de vida que existe en el planeta. Incluye todos los animales, plantas, hongos y microorganismos, así como los diferentes climas y lugares donde viven.</p>
                <h4>Niveles de Organización</h4>
                <ul>
                    <li><b>Individuo:</b> Un solo ser vivo (ej: un coyote, un girasol).</li>
                    <li><b>Población:</b> Un grupo de individuos de la misma especie que viven en el mismo lugar (ej: una manada de coyotes).</li>
                    <li><b>Comunidad:</b> Conjunto de diferentes poblaciones que viven e interactúan en un mismo lugar (ej: los coyotes, conejos y plantas del desierto).</li>
                    <li><b>Ecosistema:</b> La comunidad de seres vivos y el medio físico donde viven (factores abióticos como el agua, el sol, las rocas).</li>
                    <li><b>Hábitat:</b> Es el "hogar" de un ser vivo, el lugar donde encuentra todo lo que necesita para vivir.</li>
                    <li><b>Nicho Ecológico:</b> Es la "profesión" o función que un ser vivo desempeña en su ecosistema (ej: las abejas polinizan flores).</li>
                </ul>
                <h4>Funciones Vitales</h4>
                <p>Todos los seres vivos realizan funciones para mantenerse con vida:</p>
                <ul>
                    <li><b>Nutrición:</b> Obtener energía. Los <b>Autótrofos</b> como las plantas producen su propio alimento (fotosíntesis). Los <b>Heterótrofos</b> como los animales se alimentan de otros seres.</li>
                    <li><b>Relación:</b> Percibir lo que pasa alrededor y reaccionar.</li>
                    <li><b>Reproducción:</b> Crear nuevos seres vivos. Puede ser <b>sexual</b> (se necesitan dos progenitores) o <b>asexual</b> (un solo progenitor).</li>
                </ul>
            `,

                <h3>Adaptaciones de los Seres Vivos</h3>
                <p>Son características especiales que ayudan a los seres vivos a sobrevivir en su ambiente.</p>
                <h4>Adaptaciones para Alimentarse</h4>
                <ul>
                    <li><b>Picos:</b> Las aves tienen picos de diferentes formas para comer semillas, frutas, insectos o peces.</li>
                    <li><b>Dientes:</b> Los carnívoros tienen dientes filosos para desgarrar, y los herbívoros tienen dientes planos para moler.</li>
                    <li><b>Ecolocación:</b> Algunos animales como los murciélagos y delfines usan sonidos para "ver" en la oscuridad y encontrar su comida.</li>
                </ul>
                <h4>Adaptaciones para Defenderse</h4>
                <ul>
                    <li><b>Camuflaje:</b> Animales que se confunden con su entorno para no ser vistos (ej: insecto palo).</li>
                    <li><b>Mimetismo:</b> Un animal inofensivo se parece a uno peligroso para asustar a los depredadores (ej: una mariposa con manchas que parecen ojos de búho).</li>
                    <li><b>Olores fuertes:</b> El zorrillo lanza un líquido de mal olor para alejar a sus enemigos.</li>
                    <li><b>Veneno:</b> Algunas serpientes o ranas tienen veneno para defenderse.</li>
                    <li><b>Caparazones y espinas:</b> Las tortugas tienen un caparazón duro y los puercoespines tienen espinas.</li>
                </ul>
                <h4>Adaptaciones a los Estímulos del Ambiente</h4>
                <ul>
                    <li><b>Tropismo:</b> El movimiento de las plantas hacia un estímulo. Fototropismo es crecer hacia la luz, y geotropismo es que las raíces crezcan hacia la tierra.</li>
                    <li><b>Migración:</b> Desplazamiento de animales a largas distancias buscando mejor clima o alimento (ej: las ballenas o las mariposas monarca).</li>

                </ul>
            `,

                <h3>Amenazas y Conservación de la Biodiversidad</h3>
                <p>La biodiversidad de Costa Rica es increíble, pero enfrenta peligros por actividades humanas.</p>

                    <li><b>Agricultura no sostenible:</b> Cuando se siembra un solo cultivo (monocultivo) se pierde variedad y se usan químicos que contaminan el suelo y el agua.</li>
                    <li><b>Caza indiscriminada:</b> Cazar animales por deporte o para venderlos como mascotas puede hacer que desaparezcan.</li>

                    <li>Respetar y cuidar las áreas protegidas como los parques nacionales.</li>
                    <li>Usar productos que no contaminen.</li>
                </ul>
                <p>Aprovechar la biodiversidad de forma inteligente (turismo ecológico, medicinas naturales) también ayuda a conservarla.</p>
            `

            { topic: 'amenazas', q: '¿Por qué es importante la educación ambiental?', opts: ['Para aprender a dibujar animales', 'Para enseñar a las personas a proteger el ambiente', 'Para saber los nombres de todos los árboles'], a: 'Para enseñar a las personas a proteger el ambiente', exp: 'La educación ambiental nos da el conocimiento y la conciencia para tomar mejores decisiones y cuidar nuestro planeta.'},
            { topic: 'amenazas', q: '¿Verdadero o Falso? La pesca artesanal, que usa métodos tradicionales, no daña tanto los ecosistemas marinos.', opts: ['Verdadero', 'Falso'], a: 'Verdadero', exp: 'Correcto. A diferencia de la pesca industrial de arrastre, la pesca artesanal es más selectiva y tiene un menor impacto en el ecosistema.'},
            { topic: 'amenazas', q: '¿Qué es la reforestación?', opts: ['Cortar todos los árboles de un bosque', 'Plantar nuevos árboles donde antes había un bosque', 'Construir casas en el bosque'], a: 'Plantar nuevos árboles donde antes había un bosque', exp: 'La reforestación es una acción clave para recuperar los bosques y los hábitats que se han perdido.'},
            { topic: 'amenazas', q: 'Los Parques Nacionales y las Reservas Biológicas son...', opts: ['Lugares para ir de compras', 'Áreas protegidas para la conservación', 'Zonas para construir industrias'], a: 'Áreas protegidas para la conservación', exp: 'Son áreas donde la naturaleza está protegida por ley para conservar la biodiversidad para el futuro.'},
            { topic: 'amenazas', q: '¿Cómo afecta la contaminación del aire a la biodiversidad?', opts: ['No la afecta', 'Puede causar lluvia ácida y enfermedades a los seres vivos', 'Hace que las plantas crezcan más rápido'], a: 'Puede causar lluvia ácida y enfermedades a los seres vivos', exp: 'Los gases contaminantes alteran la química de la atmósfera y del agua, afectando a todos los ecosistemas.'}
        ];

        let shuffledQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let questionsAnsweredCorrectly = 0;
        let totalQuestionsInQuiz = 0;

        const progressBar = document.getElementById('progress-bar');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const quizContainer = document.getElementById('quiz-container');
        const resultsContainer = document.getElementById('results-container');
        const scoreEl = document.getElementById('score');
        const topicContentEl = document.getElementById('topic-content');

        function showContent(tabName) {
            document.getElementById('estudio').style.display = 'none';
            document.getElementById('quiz').style.display = 'none';
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabName).style.display = 'block';
            document.querySelector(`.tab-button[onclick="showContent('${tabName}')"]`).classList.add('active');
            
            if (tabName === 'quiz' && totalQuestionsInQuiz === 0) {
                startQuiz();
            }
        }

        function showTopic(topicName) {
            topicContentEl.innerHTML = topicData[topicName];
            document.querySelectorAll('#estudio .tab-button').forEach(b => b.classList.remove('active'));
            document.querySelector(`#estudio .tab-button[onclick="showTopic('${topicName}')"]`).classList.add('active');
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            shuffledQuestions = shuffle([...questions]);
            totalQuestionsInQuiz = questions.length;
            currentQuestionIndex = 0;
            score = 0;
            questionsAnsweredCorrectly = 0;
            resultsContainer.style.display = 'none';
            quizContainer.style.display = 'block';
            updateProgressBar();
            displayQuestion();
        }
        
        function restartQuiz() {
            totalQuestionsInQuiz = 0;
            startQuiz();
        }

        function displayQuestion() {
            feedbackEl.innerHTML = '';
            feedbackEl.style.backgroundColor = 'transparent';
            const currentQuestion = shuffledQuestions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.q;
            optionsEl.innerHTML = '';
            currentQuestion.opts.forEach(option => {
                const button = document.createElement('div');
                button.textContent = option;
                button.classList.add('option');
                button.onclick = () => checkAnswer(option, button);
                optionsEl.appendChild(button);
            });
        }

        function checkAnswer(selectedOption, button) {
            const currentQuestion = shuffledQuestions[currentQuestionIndex];
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.onclick = null);

            const explanationDiv = `<div class="explanation">${currentQuestion.exp}</div>`;

            if (selectedOption === currentQuestion.a) {
                score++;
                questionsAnsweredCorrectly++;
                feedbackEl.innerHTML = `¡Correcto! 😄 ${explanationDiv}`;
                feedbackEl.style.backgroundColor = '#e8f5e9';
                button.style.backgroundColor = 'var(--correct-color)';
                button.style.color = 'white';
                currentQuestionIndex++;
            } else {
                feedbackEl.innerHTML = `¡Ups! La respuesta correcta era "${currentQuestion.a}". ${explanationDiv}`;
                feedbackEl.style.backgroundColor = '#ffebee';
                button.style.backgroundColor = 'var(--wrong-color)';
                button.style.color = 'white';
                
                allOptions.forEach(opt => {
                    if (opt.textContent === currentQuestion.a) {
                        opt.style.backgroundColor = 'var(--correct-color)';
                        opt.style.color = 'white';
                    }
                });

                const failedTopic = currentQuestion.topic;
                shuffledQuestions.splice(currentQuestionIndex, 1); 
                
                const retryQuestionIndex = shuffledQuestions.findIndex((q, i) => q.topic === failedTopic && i >= currentQuestionIndex);

                if (retryQuestionIndex !== -1) {
                    const [retryQuestion] = shuffledQuestions.splice(retryQuestionIndex, 1);
                    shuffledQuestions.splice(currentQuestionIndex, 0, retryQuestion);
                }
            }
            
            updateProgressBar();

            const nextButton = document.createElement('button');
            nextButton.textContent = 'Siguiente →';
            nextButton.classList.add('tab-button');
            nextButton.style.marginTop = '15px';
            nextButton.onclick = () => {
                if (currentQuestionIndex < shuffledQuestions.length) {
                    displayQuestion();
                } else {
                    showResults();
                }
            };
            feedbackEl.appendChild(nextButton);
        }

        function updateProgressBar() {
            const progress = (questionsAnsweredCorrectly / totalQuestionsInQuiz) * 100;
            progressBar.style.width = progress + '%';
            progressBar.textContent = Math.round(progress) + '%';
        }

        function showResults() {
            quizContainer.style.display = 'none';
            resultsContainer.style.display = 'block';
            scoreEl.textContent = `${score} de ${totalQuestionsInQuiz}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            showTopic('biodiversidad'); 
        });
    </script>

</body>
