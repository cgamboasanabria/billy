[project]
name = "billy"
version = "0.1.0"
description = "Herramientas educativas para Billy: generacion de material de estudio y tutor IA anclado a fuentes."
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "openai",
    "pypdf",
    "keyring",
    "pillow",
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--tb=short --cov=Script/functions --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
